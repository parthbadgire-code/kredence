[package]
name = "anchor_kredence"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "anchor_kredence"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
# Anchor 1.0.x lang/spl — compatible with Solana CLI 4.x and uses
# cargo build-sbf (not the deprecated build-bpf).
# All Bubblegum/compression CPIs are performed via raw solana_program::invoke
# to avoid transitive dependency conflicts.
anchor-lang = "1.0.1"
anchor-spl = "1.0.1"
